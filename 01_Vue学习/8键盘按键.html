<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>8键盘按键</title>
    <script type="text/javascript" src="../js/vue.js"></script>
    <style>
        * {
            margin-top: 20px;
        }

        .msg1 {
            height: 50px;
            background-color: red;
        }

        .msg2 {
            height: 50px;
            background-color: rgb(46, 20, 113);
        }
    </style>
</head>
<!--    
Vue中的键盘按键修饰符:
1.enter:监听回车键
2.tab:监听Tab键
3.delete:监听删除键
4.esc:监听ESC键
5.space:监听空格键
6.up:监听上箭头键
7.down:监听下箭头键
8.left:监听左箭头键
9.right:监听右箭头键
10. caps-lock:监听CapsLock键

2.Vue未提供别名的按键,可以使用按键原始的key值去绑定,但注意要转为kebab-case(短横线命名)

3.系统修饰键
用法特殊):ctrl、alt、shift、meta
(1).配合keyup使用:按下修饰键的同时,再按下其他键,随后释放其他键,事件才被触发。
(2).配合keydown使用:正常触发事件。

4.也可以使用keyCode去指定具体的按键(不推荐)
5.Vue.config.keyCodes.自定义键名=键码,可以去定制按别名
-->

<body>
    <div id="app">
        <h2>欢迎来到{{name}}学</h2>
        <input type="text" @keyup.ctrl.a="showxqq" placeholder="请输入内容,按回车键提示信息">
        <br>
    </div>
</body>

<script type="text/javascript">
    var app = new Vue({
        el: '#app',
        data: {
            name: '岳阳'
        },
        methods: {
            showxqq(e) {
                alert(e.target.value);
            }
        }
    })
</script>

</html>
