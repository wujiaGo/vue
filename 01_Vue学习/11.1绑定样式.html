<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>计数属性</title>
    <script type="text/javascript" src="../js/vue.js"></script>
    <style>
        * {
            margin-top: 20px;
        }

        .msg1 {
            height: 50px;
            background-color: red;
        }

        .msg2 {
            height: 50px;
            background-color: rgb(70, 17, 206);
        }

        .msg3 {
            height: 50px;
            background-color: rgb(21, 216, 57);
            color: white;
        }
    </style>
</head>

<body>
    <div id="vm" :class="msg1" @click="changeMode">
        <div :class="msg1" @click="changeMode">
            {{name1}}
        </div>
        <div :class="msg2" @click="changeMode">
            {{name2}}
        </div>
    </div>


</body>

<script type="text/javascript">
    var vm = new Vue({
        el: '#vm',
        data: {
            name1: '点击换样式',
            name2: '佳',
            fuulName: this.name1 + '-' + this.name2,
            msg1: 'msg1',
            msg2: ['msg1', 'msg2', 'msg3']
        },
        methods: {
            changeMode() {
                const array = ['msg1', 'msg2', 'msg3'];
                this.msg1 = array[Math.floor(Math.random() * 3)];
            }
        },
    })
</script>

</html>
