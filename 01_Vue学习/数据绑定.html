<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>数据绑定</title>
    <script type="text/javascript" src="../js/vue.js"></script>
</head>

<body>
    <div id="app">
        单项数据绑定 <input type="text" :value="message">
        双项数据绑定 <input type="text" v-model="message">
    </div>
</body>
<script>
    var app = new Vue({
        el: '#app',
        data: {
            message: 'hello world'
        }
    })
</script>
</body>

</html>
