<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>计数属性</title>
    <script type="text/javascript" src="../js/vue.js"></script>
    <style>
        * {
            margin-top: 20px;
        }

        .msg1 {
            height: 50px;
            background-color: red;
        }

        .msg2 {
            height: 50px;
            background-color: rgb(46, 20, 113);
        }
    </style>
</head>

<body>
    <div id="vm" :class="msg1" @click="changeMode">
        {{name1}}
    </div>
</body>

<script type="text/javascript">
    var vm = new Vue({
        el: '#vm',
        data: {
            name1: '伍',
            name2: '佳',
            fuulName: this.name1 + '-' + this.name2,
            msg1: 'msg1',
        },
        methods: {
            changeMode() {
                const array = [ 'msg1', 'msg2' ]
                var index = array.indexOf(this.msg1);                
                this.msg1 = array[(index + 1) % array.length];
            }
        },
    })
</script>

</html>
