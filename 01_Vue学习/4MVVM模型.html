<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>el与data的两种写法</title>
    <script type="text/javascript" src="../js/vue.js"></script>
</head>

<body>
    <div id="app">
        <div v-bind:id="message">{{message}}</div>
        <h1>学校名称:{{message}}</h1>
        <h1>学校地址:{{address}}</h1>
    </div>
</body>
<script>
    const app = new Vue({
        data() {
            return {
                message: '北京大学',
                address: '北京'
            }
        }
    })
    console.log(app)
    setTimeout(() => {
        app.$mount('#app')
    }, 1);
</script>
</body>

</html>
