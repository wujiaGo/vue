<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>天气案例</title>
    <script type="text/javascript" src="../js/vue.js"></script>
    <style>
        * {
            margin-top: 20px;
        }

        .msg1 {
            height: 50px;
            background-color: red;
        }

        .msg2 {
            height: 50px;
            background-color: rgb(46, 20, 113);
        }
    </style>
</head>

<!--
监视属性watch:
1.当被监视的属性变化时,回调函数自动调用,进行相关操作
2.监视的属性必须存在,
3.监视的两种写法:
才能进行监视!!
(1).new Vue时传入watch配置
(2).通过vm.$watch监视
-->
<!--
深度监视:
(1).Vue中的watch默认不监测对象内部值的改变(一层)。
(2).配置deep:true可以监测对象内部值改变(多层)。
备注:
(1).Vue自身可以监测对象内部值的改变,
但Vue提供的watch默认不可以!
(2).使用watch时根据数据的具体结构,决定是否采用深度监视。
-->

<body>
    <div id="vm">
        <h2>今天的天气很{{info}}</h2>
        <button @click="qhtq">切换天气</button>
        <hr>
        <h2>a的值: {{Numbers.a}}</h2>
        <button @click="Numbers.a++">a++</button>
        <h2>b的值: {{Numbers.b}}</h2>
        <button @click="Numbers.b++">b++</button>
    </div>
</body>

<script type="text/javascript">
    var vm = new Vue({
        el: '#vm',
        data: {
            isHot: true,
            Numbers: {
                a: 1,
                b: 1
            }
        },
        methods: {
            qhtq() {
                if (this.isHot) {
                    this.isHot = false
                } else {
                    this.isHot = true
                }
            }
        },
        computed: {
            info() {
                return this.isHot ? '炎热' : '凉爽'
            }
        },
        watch: {
            //简写
            info: function () {
                console.log('天气发生了改变')
            },
            // info: {
            //     // immediate: true, //初始化时执行
            //     // deep: true, //深度监视
            //     // handler() {
            //     //     console.log('天气发生了改变')
            //     // }
            // },
            'Numbers.a': {
                handler() {
                    console.log('a发生了改变')
                }

            },
            'Numbers.b': {
                handler() {
                    console.log('b发生了改变')
                }
            },
            Numbers: {
                deep: true, //深度监视
                handler() {
                    console.log('Numbers发生了改变')
                }
            }
        }
    })
    //正常写法
    vm.$watch('isHot', {
        immediate: true,//初始化时让handler调用一下
        deep: true,//深度监视
        handler(newValue, oldValue) {
            console.log('isHot被修改了', newValue, oldValue)
        }
    })

    //简写
    vm.$watch('isHot', function (newValue, oldValue) {
        console.log('isHot被修改了', newValue, oldValue)
    })
</script>

</html>
