<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>数据代理</title>
    <script type="text/javascript" src="../js/vue.js"></script>
    <style>
        * {
            margin-top: 20px;
        }

        .msg1 {
            height: 50px;
            background-color: red;
        }

        .msg2 {
            height: 50px;
            background-color: rgb(46, 20, 113);
        }
    </style>
</head>
<!--    
Vue中的事件修饰符:
1.prevent:阻止默认事件(常用D);
2.stop:阻止事件冒泡(常用);
3.once:事件只触发一次(常用):
4.capture:使用事件的捕获模式;
5.self:只有event.target是当前操作的元素是才触发事件:
6.passive:事件的默认行为立即执行,无需等待事件回调执行完毕
    -->

<body>
    <div id="app">
        <h2>欢迎来到{{name}}学</h2>
        <!-- .prevent 阻止默认事件-->
        <a href="https://www.baidu.com/" @click.prevent="showxqq">点我提示信息</a>
        <br>
        <!-- .stop 阻止事件冒泡-->
        <div class="demo1" @click="showxqq">
            <!-- <button @click.stop="showxqq">点我提示信息</button> -->
            <!-- 修饰符可以连续写 -->
            <a href="https://www.baidu.com/" @click.prevent.stop="showxqq">点我提示信息</a>
        </div>
        <br>
        <!-- .once 事件只触发一次-->
        <button @click.once="showxqq">点我提示信息</button>
        <br>
        <!-- .capture 使用事件的捕获模式-->
        <div @click.capture="showMsg(1)" class="msg1">点我提示信息
            <div @click="showMsg(2)" class="msg2">点我提示信息
            </div>
        </div>
    </div>
</body>

<script type="text/javascript">
    var app = new Vue({
        el: '#app',
        data: {
            name: '岳阳'
        },
        methods: {
            showxqq() {
                alert('欢迎来到' + this.name + '学习')
                this.name = '无锡'
            },
            showMsg(msg) {
                alert(msg)
            }
        }
    })
</script>

</html>
