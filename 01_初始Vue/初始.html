<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>初始</title>
    <!-- 引入Vue.js -->
    <script type="text/javascript" src="../js/vue.js"></script>

</head>
</head>

<body>
    <div id="root">
        <h1>{{msg}}</h1>
    </div>

    <script type="text/javascript">
        Vue.config.productionTip = false
        //创建实例
        const x = new Vue({
            el: '#root',   //指定容器,值通常为css选择器
            data: {  //暂存数据
                msg: 'Hello,伍佳111'
            }
        })
    </script>
</body>

</html>
